name: CI-CD

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas unitarias
        run: npm run test:api

  docker:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/inventario-api:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/inventario-api:${{ github.sha }} .

      - name: Publicar imagen
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/inventario-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/inventario-api:${{ github.sha }}

  deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

      - name: Desplegar en EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/key.pem \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOSTNAME }} "

          docker pull ${{ secrets.DOCKER_USERNAME }}/inventario-api:latest

          docker stop inventario || true

          docker rm inventario || true

          docker run -d \
            -p 8080:80 \
            -p 6061:6061 \
            --restart always \
            --name inventario \
            ${{ secrets.DOCKER_USERNAME }}/inventario-api:latest

          "